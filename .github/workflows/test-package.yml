name: Test package

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate: true
          activate-environment: ""
      - name: Setup environment
        run: |
          eval $(ssh-agent -s)
          mkdir -p ~/.ssh
          echo "${{ secrets.ANARCI_MHC_SSH_KEY }}" > ~/.ssh/anarci_mhc
          chmod 600 ~/.ssh/anarci_mhc
          ssh-add ~/.ssh/anarci_mhc
          ssh-add -L
          cat > "$HOME/conda_init.sh" <<'EOF'
          eval "$(conda shell.bash hook)"
          eval "$(mamba shell hook --shell bash)"
          EOF
          echo "BASH_ENV=$HOME/conda_init.sh" >> "$GITHUB_ENV"
          export BASH_ENV="$HOME/conda_init.sh"
          conda install -c conda-forge -c nodefaults mamba -y
          pip install snakemake
          export ALPHAFOLD3_WEIGHTS_DIR=''
          export ALPHAFOLD_DATA_DIR=''
          export COLABFOLD_DATA_DIR=''
          export TCRMODEL2_ALPHAFOLD_DATA_DIR=''
          snakemake environment --cores 1
          mamba run -p ./.venv pip install '.[develop]'
      - name: Lint package
        run: |
          mamba activate ./.venv
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          snakemake lint  --cores 1
      - name: Test package
        run: |
          mamba activate ./.venv
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          snakemake test --cores 1