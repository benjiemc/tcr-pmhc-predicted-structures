name: Test package

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate: true
          activate-environment: ""
      - name: Setup environment
        run: |
          conda install -c conda-forge -c nodefaults mamba -y
          pip install snakemake
          eval $(ssh-agent -s)
          mkdir -p ~/.ssh
          echo "${{ secrets.ANARCI_MHC_SSH_KEY }}" > ~/.ssh/anarci
          chmod 600 ~/.ssh/anarci
          ssh-add ~/.ssh/anarci
          ssh-add -L
          export ALPHAFOLD3_WEIGHTS_DIR=''
          export ALPHAFOLD_DATA_DIR=''
          export COLABFOLD_DATA_DIR=''
          export TCRMODEL2_ALPHAFOLD_DATA_DIR=''
          snakemake environment --cores 1
      - name: Lint package
        run: mamba run -p ./.venv snakemake lint  --cores 1 --quiet all
      - name: Test package
        run: mamba run -p ./.venv snakemake test --cores 1 --quiet all